input {
    kb_layout = us, us

    kb_variant = , intl

    kb_options =

    touchpad {
        natural_scroll = true
        scroll_factor = 0.5
        disable_while_typing = true
        tap-to-click = true
    }
    numlock_by_default = true
    

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    accel_profile=flat
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
