general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = screenshot
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.90
    brightness = 0.82
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# Soft panel behind the time/date stack (readability boost)
shape {
    monitor =
    size = 680, 360
    color = rgba(0, 0, 0, 0.25)
    rounding = 22
    position = 0, 210
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A")"
    color = rgba(255, 255, 255, 0.85)
    font_size = 78
    font_family = Ubuntu Nerd Font Bold
    position = 0, 280
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%d %B")"
    color = rgba(255, 255, 255, 0.80)
    font_size = 34
    font_family = Ubuntu Nerd Font
    position = 0, 205
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "— $(date +"%H:%M") —"
    color = rgba(255, 255, 255, 0.75)
    font_size = 18
    font_family = Ubuntu Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.config/hypr/user.jpg
    size = 120
    border_size = 2
    border_color = rgba(51, 204, 255, 0.8)
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER
    color = rgba(255, 255, 255, 0.65)
    font_size = 14
    font_family = Ubuntu Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# Caps Lock warning
label {
    monitor =
    text = cmd[update:500] sh -lc 'xset q | grep -q "Caps Lock:\s*on" && echo "󰪛 CAPS LOCK ON" || echo ""'
    color = rgba(255, 80, 80, 0.9)
    font_size = 14
    font_family = Ubuntu Nerd Font
    position = 0, -80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.12)
    font_color = rgb(255, 255, 255)

    fade_on_empty = false
    placeholder_text = 󰌾 Password...
    ignore_empty_input = true

    rounding = 18
    position = 0, -130
    halign = center
    valign = center
}
