# ===============================
# 🎮 GAME MODE
# ===============================

# --- ENTER Game Mode (only when NOT in any submap) ---
bind = $mainMod, G, exec, hyprpanel -o 'theme.bar.buttons.modules.submap.text' -v '#3584e4'

#bind = $mainMod, G, exec, ~/.config/waybar/scripts/waybar-theme.sh gaming


bind = $mainMod, G, exec, hyprctl keyword general:col.active_border "rgba(3584e4ee) rgba(1f6febee) 45deg"
bind = $mainMod, G, exec, hyprctl keyword general:col.inactive_border "rgba(303030aa)"

bind = $mainMod, G, exec, hyprctl notify 2 2000 "rgb(33ccff)" "🎮 Gaming Mode Active: Shortcuts Disabled"
bind = $mainMod, G, submap, GAMING


# ===============================
# 🎮 GAMING SUBMAP
# ===============================
submap = GAMING

# ---- Block Dangerous Shortcuts ----
bind = $mainMod, Q, exec, hyprctl notify 1 2000 "rgb(ff0000)" "❌ DISABLED: Press Super+G to exit Game Mode!"
bind = $mainMod, B, exec, hyprctl notify 1 2000 "rgb(ff0000)" "❌ DISABLED: Press Super+G to exit Game Mode!"
bind = $mainMod, E, exec, hyprctl notify 1 2000 "rgb(ff0000)" "❌ DISABLED: Press Super+G to exit Game Mode!"

bind = $mainMod, C, exec, hyprctl notify 1 2000 "rgb(ff0000)" "❌ DISABLED: Press Super+G to exit Game Mode!"
bind = $mainMod, F, exec, hyprctl notify 1 2000 "rgb(ff0000)" "❌ DISABLED: Press Super+G to exit Game Mode!"
bind = $mainMod SHIFT, S, exec, hyprctl notify 1 2000 "rgb(ff0000)" "❌ DISABLED in Game Mode"

# ---- Allow Rofi ----
bind = $mainMod, Space, exec, rofi -show drun
bind = $mainMod, S, exec, hyprctl dispatch focusmonitor HDMI-A-1 && hyprctl dispatch togglespecialworkspace

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, F1, workspace, 5
bind = $mainMod, F2, workspace, 6
bind = $mainMod, F3, workspace, 7
bind = $mainMod, F4, workspace, 8

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, F1, movetoworkspace, 5
bind = $mainMod SHIFT, F2, movetoworkspace, 6
bind = $mainMod SHIFT, F3, movetoworkspace, 7
bind = $mainMod SHIFT, F4, movetoworkspace, 8
# ---- Allow Volume Keys ----
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# --- EXIT Game Mode (ONLY inside GAMING submap) ---
bind = $mainMod, G, exec, hyprpanel -o 'theme.bar.buttons.modules.submap.text' -v '#ffffff'

#bind = $mainMod, G, exec, ~/.config/waybar/scripts/waybar-theme.sh cyan

# Exit Game Mode (add these)
bind = $mainMod, G, exec, hyprctl keyword general:col.active_border "rgba(33ccffee) rgba(00ff99ee) 45deg"
bind = $mainMod, G, exec, hyprctl keyword general:col.inactive_border "rgba(595959aa)"


bind = $mainMod, G, exec, hyprctl notify 2 2000 "rgb(00ff99)" "🟢 Game Mode Off: Shortcuts Restored"
bind = $mainMod, G, submap, reset

submap = reset
